---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local

  vars:
    image_name: my-country-service
    image_tag: v1
    dockerfile_path: './'
  
  vars_files:
    - vault.yml

  tasks:
    - name: Log in to Docker Hub
      community.general.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
    
        reauthorize: yes 
        
    - name: Build Docker image
      docker_image:
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"
        source: build
        state: present
        tag: "{{ image_tag }}"
    - name: Push the Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        push: yes
        source: local

    - name: Pull Docker image (optional, for verification or on target nodes)
      docker_image:
        name: "{{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"
        tag: "{{ image_tag }}"
        source: pull
    - name: Create monitoring namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: monitoring
        kubeconfig: config

    - name: Deploy Prometheus ConfigMap
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        src: prometheus-config.yaml
        kubeconfig: config

    - name: Deploy Prometheus Deployment
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        src: prometheus-deployment.yaml
        kubeconfig: config

    - name: Deploy Prometheus Service
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        src: prometheus-service.yaml
        kubeconfig: config

    - name: Deploy Grafana Deployment
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        src: grafana-deployment.yaml
        kubeconfig: config

    - name: Deploy Grafana Service
      kubernetes.core.k8s:
        state: present
        namespace: monitoring
        src: grafana-service.yaml
        kubeconfig: config
    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        definition: "{{ lookup('template', 'my-deployment.yaml') }}"
        kubeconfig: config # Path to your kubeconfig file

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: service.yaml
        kubeconfig: config 
